name: Build & Release

# Trigger: push di un tag versione (es. git tag v0.2.0 && git push --tags)
#
# NOTA (2026-08-05, upgrade Flet 0.85.3 → 0.86.5): la versione di `flet` qui
# sotto (`pip install flet==...`) NON viene letta da `pyproject.toml` — è
# hardcoded 4 volte, una per job (Windows/macOS/Linux/Android). Aggiornare
# QUI, non solo in pyproject.toml/requirements.txt, altrimenti la release
# reale continua a compilare con la versione vecchia in silenzio.
# `flutter-version` deve restare allineata alla Flutter bundlata dalla
# versione di `flet` installata (verificato empiricamente eseguendo `flet
# --version` in un venv pulito, non assunto dal changelog): 0.85.3 →
# Flutter 3.41.7, 0.86.5 → Flutter 3.44.8. Un disallineamento qui rompe la
# build silenziosamente o con errori Flutter oscuri, non con un errore
# chiaro "versione sbagliata".
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # necessario per creare il GitHub Release

jobs:
  # ─────────────────────────────────────────────────────────────
  # Windows (.exe)
  # ─────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - name: Inject version from git tag
        uses: ./.github/actions/inject-version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"
          cache: true

      - name: Install Python dependencies
        run: pip install flet==0.86.5 "Pillow>=10.0.0"

      - name: Build Windows
        run: echo "y" | flet build windows --no-rich-output

      - name: Package artifact
        shell: pwsh
        run: |
          $release_dir = Get-ChildItem -Recurse -Path build\windows -Filter "*.exe" | Select-Object -First 1 -ExpandProperty DirectoryName
          Compress-Archive -Path "$release_dir\*" -DestinationPath dnd-companion-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dnd-companion-windows.zip

  # ─────────────────────────────────────────────────────────────
  # macOS (.app)
  # ─────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version from git tag
        uses: ./.github/actions/inject-version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"
          cache: true

      - name: Install Python dependencies
        run: pip install flet==0.86.5 "Pillow>=10.0.0"

      - name: Build macOS
        run: echo "y" | flet build macos --no-rich-output

      - name: Ad-hoc sign the app
        run: |
          APP=$(find build/macos -name "*.app" -maxdepth 5 | head -1)
          echo "Firmo: $APP"
          codesign --force --deep --sign - "$APP"

      - name: Package artifact
        run: |
          APP=$(find build/macos -name "*.app" -maxdepth 5 | head -1)
          echo "Dimensione originale: $(du -sh "$APP" | cut -f1)"
          # Rimuove debug symbols (.dSYM) — non servono per distribuzione, pesano centinaia di MB
          find build/macos -name "*.dSYM" -type d -exec rm -rf {} + 2>/dev/null || true
          find "$APP" -name "*.dSYM" -type d -exec rm -rf {} + 2>/dev/null || true
          echo "Dimensione dopo rimozione dSYM: $(du -sh "$APP" | cut -f1)"
          # ditto preserva symlink e metadata macOS
          ditto -c -k --keepParent "$APP" dnd-companion-macos.zip
          echo "Dimensione archivio finale: $(du -sh dnd-companion-macos.zip | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dnd-companion-macos.zip

  # ─────────────────────────────────────────────────────────────
  # Linux (binary)
  # ─────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version from git tag
        uses: ./.github/actions/inject-version

      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build libgtk-3-dev libglib2.0-dev \
            libglu1-mesa libasound2-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"
          cache: true

      - name: Install Python dependencies
        run: pip install flet==0.86.5 "Pillow>=10.0.0"

      - name: Build Linux
        run: echo "y" | flet build linux --no-rich-output

      - name: Package artifact
        run: |
          echo "=== struttura build ==="
          find build/ -type d | head -40 || true
          BUNDLE=$(find build/ -name "bundle" -type d | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "ERROR: bundle directory non trovata"
            exit 1
          fi
          echo "Bundle trovato in: $BUNDLE"
          tar -czf dnd-companion-linux.tar.gz -C "$(dirname "$BUNDLE")" bundle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dnd-companion-linux.tar.gz

  # ─────────────────────────────────────────────────────────────
  # Android (.apk)
  # ─────────────────────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version from git tag
        uses: ./.github/actions/inject-version

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"
          cache: true

      - name: Install Python dependencies
        run: pip install flet==0.86.5 "Pillow>=10.0.0"

      # ─── Firma di rilascio permanente ────────────────────────────────
      # Causa radice del problema "devo disinstallare e reinstallare l'app ogni
      # volta" segnalato da Davide (2026-08-17). Senza questa configurazione
      # `flet build apk` genera un APK firmato col keystore di DEBUG, che
      # Flutter/Gradle rigenera su OGNI runner: ogni release aveva una firma
      # diversa e Android rifiutava l'aggiornamento in loco
      # (INSTALL_FAILED_UPDATE_INCOMPATIBLE), obbligando a disinstallare — e la
      # disinstallazione cancella il database, `app_settings` incluso, quindi
      # anche il `device_id`.
      #
      # Verificato nel sorgente installato di flet_cli 0.86.5
      # (`commands/build_base.py:1217` e `:2166`): le quattro variabili
      # d'ambiente qui sotto bastano da sole — `FLET_ANDROID_SIGNING_KEY_STORE`
      # attiva anche il blocco `signingConfigs { create("release") }` nel
      # template gradle (che è condizionato a `cookiecutter.options.
      # android_signing`), quindi NON serve nulla in `pyproject.toml`.
      #
      # Il percorso del keystore DEVE essere assoluto: nel gradle generato è
      # `file(it)` dentro il modulo `app`, quindi un percorso relativo verrebbe
      # risolto rispetto a `build/flutter/android/app`. `${{ runner.temp }}` è
      # assoluto.
      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 mancante. Senza la"
            echo "::error::chiave di rilascio l'APK sarebbe firmato in debug e"
            echo "::error::obbligherebbe di nuovo a disinstallare l'app."
            echo "::error::Vedi RELEASE.md, «Migrazione alla firma di rilascio»."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "Keystore decodificato ($(stat -c%s "$RUNNER_TEMP/upload-keystore.jks") byte)"

      - name: Build Android APK
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ runner.temp }}/upload-keystore.jks
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: upload
        run: echo "y" | flet build apk --no-rich-output

      # Lo step che DIMOSTRA il fix, invece di sperarlo: se per qualunque motivo
      # l'APK tornasse a essere firmato in debug (secret svuotato, template
      # cambiato in un aggiornamento di Flet, variabile rinominata), la release
      # si ferma qui invece di uscire e costringere tutti a disinstallare di
      # nuovo. Stampa anche versionCode/versionName, così l'iniezione della
      # versione è verificabile dal log.
      - name: Verify APK signature and version
        run: |
          set -euo pipefail
          APK=$(find build -name "app-release.apk" | head -1)
          echo "APK: $APK"

          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f 2>/dev/null | sort -r | head -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner non trovato in ANDROID_HOME ($ANDROID_HOME)."
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt

          if grep -qi "CN=Android Debug" certs.txt; then
            echo "::error::L'APK è firmato con il keystore di DEBUG: un'installazione"
            echo "::error::esistente non potrebbe aggiornarsi in loco. Release interrotta."
            exit 1
          fi
          if ! grep -qi "CN=DnD Companion" certs.txt; then
            echo "::error::L'APK non è firmato con la chiave di rilascio attesa"
            echo "::error::(CN=DnD Companion). Release interrotta."
            exit 1
          fi
          echo "Firma di rilascio verificata."

          AAPT=$(find "$ANDROID_HOME" -name aapt2 -type f 2>/dev/null | sort -r | head -1)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" | grep -E "package: name" || true
          fi

      - name: Find and rename APK
        run: |
          APK=$(find build -name "app-release.apk" | head -1)
          cp "$APK" dnd-companion-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dnd-companion-android.apk

  # ─────────────────────────────────────────────────────────────
  # Crea GitHub Release e allega tutti gli artefatti
  # ─────────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download tutti gli artefatti
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Crea Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/windows/dnd-companion-windows.zip
            artifacts/macos/dnd-companion-macos.zip
            artifacts/linux/dnd-companion-linux.tar.gz
            artifacts/android/dnd-companion-android.apk
