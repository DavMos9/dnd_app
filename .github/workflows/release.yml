name: Build & Release

# Trigger: push di un tag versione (es. git tag v0.2.0 && git push --tags)
#
# NOTA (2026-08-05, upgrade Flet 0.85.3 → 0.86.5): la versione di `flet` qui
# sotto (`pip install flet==...`) NON viene letta da `pyproject.toml` — è
# hardcoded 4 volte, una per job (Windows/macOS/Linux/Android). Aggiornare
# QUI, non solo in pyproject.toml/requirements.txt, altrimenti la release
# reale continua a compilare con la versione vecchia in silenzio.
# `flutter-version` deve restare allineata alla Flutter bundlata dalla
# versione di `flet` installata (verificato empiricamente eseguendo `flet
# --version` in un venv pulito, non assunto dal changelog): 0.85.3 →
# Flutter 3.41.7, 0.86.5 → Flutter 3.44.8. Un disallineamento qui rompe la
# build silenziosamente o con errori Flutter oscuri, non con un errore
# chiaro "versione sbagliata".
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # necessario per creare il GitHub Release

jobs:
  # ─────────────────────────────────────────────────────────────
  # Windows (.exe)
  # ─────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - name: Inject version from git tag
        shell: python
        run: |
          import re, os
          ver = os.environ['GITHUB_REF_NAME'].lstrip('v')
          for path, pattern, repl in [
              ('version.py',    r'APP_VERSION = ["\'].+?["\']', f'APP_VERSION = "{ver}"'),
              ('pyproject.toml', r'^version = ".+"$',           f'version = "{ver}"'),
              ('pyproject.toml', r'^app\.version = ".+"$',       f'app.version = "{ver}"'),
          ]:
              content = re.sub(pattern, repl, open(path).read(), flags=re.MULTILINE)
              open(path, 'w').write(content)
          print(f'Version set to: {ver}')

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Flutter 3.41.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"
          cache: true

      - name: Install Python dependencies
        run: pip install flet==0.86.5 "Pillow>=10.0.0"

      - name: Build Windows
        run: echo "y" | flet build windows --no-rich-output

      - name: Package artifact
        shell: pwsh
        run: |
          $release_dir = Get-ChildItem -Recurse -Path build\windows -Filter "*.exe" | Select-Object -First 1 -ExpandProperty DirectoryName
          Compress-Archive -Path "$release_dir\*" -DestinationPath dnd-companion-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dnd-companion-windows.zip

  # ─────────────────────────────────────────────────────────────
  # macOS (.app)
  # ─────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version from git tag
        shell: python
        run: |
          import re, os
          ver = os.environ['GITHUB_REF_NAME'].lstrip('v')
          for path, pattern, repl in [
              ('version.py',    r'APP_VERSION = ["\'].+?["\']', f'APP_VERSION = "{ver}"'),
              ('pyproject.toml', r'^version = ".+"$',           f'version = "{ver}"'),
              ('pyproject.toml', r'^app\.version = ".+"$',       f'app.version = "{ver}"'),
          ]:
              content = re.sub(pattern, repl, open(path).read(), flags=re.MULTILINE)
              open(path, 'w').write(content)
          print(f'Version set to: {ver}')

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Flutter 3.41.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"
          cache: true

      - name: Install Python dependencies
        run: pip install flet==0.86.5 "Pillow>=10.0.0"

      - name: Build macOS
        run: echo "y" | flet build macos --no-rich-output

      - name: Ad-hoc sign the app
        run: |
          APP=$(find build/macos -name "*.app" -maxdepth 5 | head -1)
          echo "Firmo: $APP"
          codesign --force --deep --sign - "$APP"

      - name: Package artifact
        run: |
          APP=$(find build/macos -name "*.app" -maxdepth 5 | head -1)
          echo "Dimensione originale: $(du -sh "$APP" | cut -f1)"
          # Rimuove debug symbols (.dSYM) — non servono per distribuzione, pesano centinaia di MB
          find build/macos -name "*.dSYM" -type d -exec rm -rf {} + 2>/dev/null || true
          find "$APP" -name "*.dSYM" -type d -exec rm -rf {} + 2>/dev/null || true
          echo "Dimensione dopo rimozione dSYM: $(du -sh "$APP" | cut -f1)"
          # ditto preserva symlink e metadata macOS
          ditto -c -k --keepParent "$APP" dnd-companion-macos.zip
          echo "Dimensione archivio finale: $(du -sh dnd-companion-macos.zip | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dnd-companion-macos.zip

  # ─────────────────────────────────────────────────────────────
  # Linux (binary)
  # ─────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version from git tag
        shell: python
        run: |
          import re, os
          ver = os.environ['GITHUB_REF_NAME'].lstrip('v')
          for path, pattern, repl in [
              ('version.py',    r'APP_VERSION = ["\'].+?["\']', f'APP_VERSION = "{ver}"'),
              ('pyproject.toml', r'^version = ".+"$',           f'version = "{ver}"'),
              ('pyproject.toml', r'^app\.version = ".+"$',       f'app.version = "{ver}"'),
          ]:
              content = re.sub(pattern, repl, open(path).read(), flags=re.MULTILINE)
              open(path, 'w').write(content)
          print(f'Version set to: {ver}')

      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build libgtk-3-dev libglib2.0-dev \
            libglu1-mesa libasound2-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Flutter 3.41.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"
          cache: true

      - name: Install Python dependencies
        run: pip install flet==0.86.5 "Pillow>=10.0.0"

      - name: Build Linux
        run: echo "y" | flet build linux --no-rich-output

      - name: Package artifact
        run: |
          echo "=== struttura build ==="
          find build/ -type d | head -40 || true
          BUNDLE=$(find build/ -name "bundle" -type d | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "ERROR: bundle directory non trovata"
            exit 1
          fi
          echo "Bundle trovato in: $BUNDLE"
          tar -czf dnd-companion-linux.tar.gz -C "$(dirname "$BUNDLE")" bundle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dnd-companion-linux.tar.gz

  # ─────────────────────────────────────────────────────────────
  # Android (.apk)
  # ─────────────────────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version from git tag
        shell: python
        run: |
          import re, os
          ver = os.environ['GITHUB_REF_NAME'].lstrip('v')
          for path, pattern, repl in [
              ('version.py',    r'APP_VERSION = ["\'].+?["\']', f'APP_VERSION = "{ver}"'),
              ('pyproject.toml', r'^version = ".+"$',           f'version = "{ver}"'),
              ('pyproject.toml', r'^app\.version = ".+"$',       f'app.version = "{ver}"'),
          ]:
              content = re.sub(pattern, repl, open(path).read(), flags=re.MULTILINE)
              open(path, 'w').write(content)
          print(f'Version set to: {ver}')

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Flutter 3.41.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"
          cache: true

      - name: Install Python dependencies
        run: pip install flet==0.86.5 "Pillow>=10.0.0"

      - name: Build Android APK
        # -vv temporaneo (2026-08-06): diagnosi del bug per cui l'APK CI ha
        # package com.flet.dnd_companion e icona di default invece della
        # config in pyproject.toml (app.bundle_id/app.name/app.icon), pur
        # essendo il file sorgente verificato corretto e valido — vedi
        # dnd_app/docs/changelog_storico.md una volta chiuso. Da rimuovere
        # (tornare a --no-rich-output semplice) una volta trovata la causa.
        run: echo "y" | flet build apk --no-rich-output -vv

      - name: Find and rename APK
        run: |
          APK=$(find build -name "app-release.apk" | head -1)
          cp "$APK" dnd-companion-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dnd-companion-android.apk

  # ─────────────────────────────────────────────────────────────
  # Crea GitHub Release e allega tutti gli artefatti
  # ─────────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download tutti gli artefatti
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Crea Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/windows/dnd-companion-windows.zip
            artifacts/macos/dnd-companion-macos.zip
            artifacts/linux/dnd-companion-linux.tar.gz
            artifacts/android/dnd-companion-android.apk
