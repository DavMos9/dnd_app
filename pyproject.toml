[project]
name = "dnd-companion"
version = "0.3.19"
description = "DnD 5e Companion App — Compagno digitale per giocatori"
# NOTA (2026-08-05, upgrade Flet 0.85.3 → 0.86.5): da 0.86 flet build sceglie
# il Python da imbarcare in base a questo campo, e di default userebbe l'ultimo
# stabile (3.14) se lasciassimo ">=3.9". Fissato a 3.12 — la stessa versione
# che TUTTE le build precedenti (Android/iOS/desktop) hanno sempre usato
# implicitamente (serious_python 1.x era mono-versione, sempre 3.12) — per
# isolare questo aggiornamento al solo repackaging Android che ci interessa,
# senza aggiungere anche l'incognita "Pillow ha ruote 3.14 pronte per
# Android/iOS?" (non verificabile da qui, nessun ambiente di build reale a
# disposizione). Non cambia lo sviluppo locale: questo campo guida solo
# `flet build`/`flet publish`, non l'interprete usato da `python main.py`.
# Guida ufficiale: https://flet.dev/docs/updates/breaking-changes/v0-86-0/default-bundled-python-3-14
requires-python = ">=3.12,<3.13"
dependencies = [
    "flet==0.86.5",
    "Pillow>=10.0.0",
    # Aggiunto il 2026-08-06: bypass per ft.FilePicker, confermato non
    # funzionante su build Android reali via log adb logcat (TimeoutException
    # lato Dart, nessuna Activity nativa avviata — non un problema risolvibile
    # nel nostro codice attorno a FilePicker, vedi dnd_app/docs/
    # changelog_storico.md e regole_flet_api.md, sezione FILE PICKER). Usato
    # da ui/mobile_webview_picker.py. Stessa versione di `flet` per restare in
    # lockstep con le release core (estensione ufficiale, mantenuta insieme).
    "flet-webview==0.86.5",
    # Aggiunto il 2026-08-06: QR d'ingresso per l'hosting LAN (richiesta di
    # Davide — collegamento rapido senza copiare indirizzo/codice/PIN a
    # mano). `qrcode` è puro Python (verificato su PyPI: nessuna libreria
    # nativa, "Requires: Python <4.0,>=3.9"), sceglie da solo il backend
    # Pillow — già una dipendenza di questo progetto — per generare
    # l'immagine PNG, senza bisogno dell'extra `[pil]`. Riguarda solo la
    # GENERAZIONE lato host: la scansione lato giocatore resta manuale
    # (nessun controllo camera/QR ufficiale in Flet — vedi
    # dnd_app/docs/multiplayer_design.md §9, nota sul passo 5).
    "qrcode==8.2",
    # Aggiunto il 2026-08-06: estensione Flet nativa scritta su misura per
    # questo progetto, terzo tentativo di risolvere la selezione immagine
    # su Android dopo il fallimento CONFERMATO sia di ft.FilePicker
    # (nessuna Activity nativa avviata, log adb logcat reale) sia del
    # fallback WebView (webview_flutter non implementa
    # onShowFileChooser su Android — vedi dnd_app/docs/changelog_storico.md
    # e regole_flet_api.md, sezione FILE PICKER). Non pubblicata su PyPI (è
    # codice scritto per questo progetto): il percorso locale va dichiarato
    # in `[tool.flet.dev_packages]` più sotto, NON qui — qui va SOLO il
    # nome del pacchetto, altrimenti `flet build` prova a risolverlo da
    # PyPI (o, se scritto come URI assoluto, produce un percorso valido
    # solo sulla macchina di chi l'ha scritto — bug reale corretto il
    # 2026-08-06, vedi changelog_storico.md: rompeva TUTTE le build CI,
    # Windows/macOS/Linux/Android, perché puntava a un path assoluto
    # esistente solo sul Mac di Davide). Usata da
    # ui/native_image_picker.py, con fallback automatico su
    # ui/mobile_webview_picker.py se questa estensione non è disponibile
    # o fallisce. ⚠️ NON compilata/testata da questo sandbox — nessun
    # toolchain Flutter/Dart disponibile, vedi il README della cartella.
    "flet-image-picker",
    # Aggiunta il 2026-08-17: stesso identico principio di flet-image-picker
    # (vedi sopra), applicato all'import personaggio/mondo su mobile
    # (.dndchar/.dndworld) dopo che Davide ha segnalato che ANCHE il
    # fallback WebView (ui/mobile_webview_picker.py, usato finora da
    # ui/views/home_view.py::_on_mobile_import() e
    # ui/views/world/world_view.py::_on_mobile_import_world()) risulta non
    # funzionante su Android reale — stessa diagnosi già nota per il caso
    # foto (webview_flutter non implementa onShowFileChooser). Estensione
    # nativa su misura, wrapper del plugin Flutter ufficiale `file_picker`
    # (diverso da `image_picker`: seleziona un file arbitrario, non solo
    # immagini da galleria). Percorso locale dichiarato in
    # `[tool.flet.dev_packages]` più sotto, non qui — stesso motivo già
    # spiegato per flet-image-picker. Usata da ui/native_file_picker.py, con
    # fallback automatico su ui/mobile_webview_picker.py se questa
    # estensione non è disponibile o fallisce. ⚠️ NON compilata/testata da
    # questo sandbox — nessun toolchain Flutter/Dart disponibile, vedi il
    # README della cartella dell'estensione.
    "flet-file-picker",
    # Aggiunta il 2026-08-17: terza estensione nativa su misura, per l'ultimo
    # passo dell'aggiornamento in-app — consegnare l'APK scaricato all'installer
    # di pacchetti di SISTEMA. Non è ottenibile dal Python: serve un FileProvider
    # per esporre il file come URI `content://` (da Android 7 un `file://`
    # solleva FileUriExposedException) e un intent nativo, e nessuna chiave di
    # pyproject.toml letta da flet_cli permette di aggiungere la risorsa XML che
    # un FileProvider richiede. A differenza delle due estensioni sopra, questa
    # NON contiene codice Kotlin: si appoggia al plugin Flutter `open_filex`, che
    # porta con sé il proprio FileProvider e il proprio filepaths.xml, uniti ai
    # nostri dal manifest merger di Gradle. Percorso locale in
    # `[tool.flet.dev_packages]` più sotto, non qui — stesso motivo già spiegato.
    # Usata da ui/native_apk_installer.py, che solleva ApkInstallerUnavailable se
    # l'estensione non è compilata in questa build: in quel caso il dialogo
    # mostra il percorso del file scaricato invece di un pulsante inerte.
    # ⚠️ NON compilata/testata da questo sandbox — vedi il README della cartella
    # per l'elenco di cosa resta da verificare, in particolare i vincoli di
    # versione su pub.dev (c'è un precedente di CI rotta su tutte e 4 le
    # piattaforme per esattamente quel motivo con flet-file-picker).
    "flet-apk-installer",
    # Aggiunte il 2026-08-06 (sessione successiva): scanner QR in-app per
    # l'ingresso in un mondo LAN ("inquadri e sei dentro", richiesta di
    # Davide) — vedi ui/views/world/qr_scanner_view.py per l'analisi
    # completa. A differenza di flet-image-picker, qui NON serve
    # un'estensione scritta per questo progetto: sono due pacchetti
    # UFFICIALI del team Flet, stessa versione di `flet` per restare in
    # lockstep con le release core.
    #   - flet-camera: anteprima live + streaming fotogrammi, powered by
    #     il pacchetto Flutter ufficiale `camera`. Copertura iOS+Android
    #     (no desktop) — verificato su pypi.org/flet.dev/docs/controls/camera
    #     prima di aggiungerla. Il pulsante che apre lo scanner in
    #     world_view.py è mostrato solo su Android/iOS (qr_scanner_supported()).
    #   - flet-permission-handler: richiesta del permesso fotocamera a
    #     runtime, raccomandata esplicitamente dalla documentazione
    #     ufficiale di flet-camera prima di inizializzare il controllo.
    "flet-camera==0.86.5",
    "flet-permission-handler==0.86.5",
    # pyzbar: decodifica dei fotogrammi JPEG in cerca di un QR. Scelta
    # (invece di scrivere un'estensione nativa attorno a mobile_scanner)
    # perché elencata tra i pacchetti binari GIÀ pre-compilati per
    # Android/iOS sull'indice pypi.flet.dev del team Flet (dipendenza
    # nativa flet-libzbar) — verificato su
    # https://flet.dev/docs/reference/binary-packages-android-ios prima di
    # sceglierla: nessuna incognita di packaging nativo come lo era stata
    # flet_image_picker (due giri di build CI falliti prima di funzionare).
    # ⚠️ Su desktop (dove flet-camera comunque non è supportata, quindi
    # questo percorso di codice non viene mai eseguito) pyzbar richiede
    # la libreria di sistema libzbar, non verificabile da questo sandbox
    # (nessun accesso root per installarla) — irrilevante in pratica
    # perché lo scanner è raggiungibile solo su Android/iOS, dove
    # flet-libzbar è fornito automaticamente da `flet build`.
    "pyzbar==0.1.9",
    # Aggiunte il 2026-08-20: export scheda personaggio in PDF — vedi il
    # commento gemello e più esteso in requirements.txt. Entrambe pure
    # Python, nessuna estensione Flet dedicata necessaria.
    "reportlab==5.0.0",
    "pypdf==6.16.1",
]

# Dipendenze "dev/path" — pacchetti locali non pubblicati su PyPI, risolti
# da `flet build` con un percorso relativo alla cartella del progetto
# (quella con questo stesso pyproject.toml), NON un URI assoluto scritto a
# mano. Meccanismo verificato leggendo il sorgente installato di
# `flet_cli==0.86.5` (`commands/build_base.py`, attorno a
# `dev_packages_configured`): per ogni voce di `[project.dependencies]` il
# cui nome pacchetto compare qui, flet_cli risolve il percorso (relativo
# alla project dir se non assoluto), lo converte in un `file://` URI
# corretto per piattaforma con `Path.as_uri()` (gestisce da solo le lettere
# di unità Windows) e lo passa al packaging — esattamente il meccanismo che
# mancava quando avevamo scritto l'URI a mano in `[project.dependencies]`
# (funzionava in locale, rompeva ogni build CI: vedi il commento lì sopra e
# changelog_storico.md, voce 2026-08-06 "CI rotta da un path assoluto").
[tool.flet.dev_packages]
flet-image-picker = "extensions/flet_image_picker"
flet-file-picker = "extensions/flet_file_picker"
flet-apk-installer = "extensions/flet_apk_installer"

[tool.flet]
# CORRETTO 2026-08-07: le chiavi sotto `app.*` (app.name/app.bundle_id/
# app.version/app.build_number/app.icon) sono lo schema di una versione
# precedente di flet_cli — con flet_cli 0.86.5 non vengono lette affatto
# (verificato leggendo il sorgente installato,
# flet_cli/commands/build_base.py): il nome prodotto/bundle id/build number
# si leggono da `tool.flet.product`/`tool.flet.bundle_id`/
# `tool.flet.build_number` (senza prefisso "app."), la versione arriva solo
# da `[project].version`, e l'icona NON ha alcuna chiave pyproject — va
# individuata per convenzione di nome file `assets/icon.<ext>` (mai in una
# sottocartella). Bug presente fin dal primo commit della release workflow
# (2026-06-25, 655b01f): l'app ha sempre avuto nome/bundle id/icona di
# default di Flet in ogni build CI, mai notato prima perché nessuno aveva
# ancora controllato l'icona da vicino. Dettaglio completo in
# dnd_app/docs/changelog_storico.md.
app.module = "main"
# "DnD" senza "&" (2026-08-07): flet_cli inserisce `product`/`project.
# description` nei template di piattaforma con una sostituzione di stringa
# semplice, senza escape XML (verificato nel sorgente, nessun
# `xml.sax.saxutils.escape`/motore che conosca l'XML in mezzo). Con "D&D
# Companion" la build Android/macOS falliva con un parse error XML reale
# (`org.xml.sax.SAXParseException: The reference to entity "D" must end
# with the ';' delimiter` — il parser leggeva "&D" come l'inizio di
# un'entità XML tipo "&amp;"). `product_name` non ha una variante per
# piattaforma in pyproject.toml (a differenza di `bundle_id`), quindi non
# è possibile tenere "&" solo su Windows/Linux senza introdurre un nome
# diverso per piattaforma — scelta di Davide: un solo nome ovunque, senza
# "&", niente rischio residuo. Dettaglio in changelog_storico.md.
product = "DnD Companion"
bundle_id = "com.davmos9.dndcompanion"
# build_number = versionCode Android. NON modificare a mano: la CI lo riscrive
# dal tag git ad ogni release (`.github/actions/inject-version`, formula in
# `version.compute_build_number()`: major*1_000_000 + minor*1_000 + patch, quindi
# v0.3.0 → 3000). Il valore committato è solo un segnaposto.
#
# CORRETTO 2026-08-17: prima era fisso a 1 e la CI non lo toccava affatto —
# riscriveva invece una chiave `app.version` che non esiste più dal 2026-08-07,
# una sostituzione a vuoto silenziosa. Risultato: OGNI apk mai rilasciato porta
# versionCode 1. Un test lo presidia (`test_versione_app.py`), e lo step
# "Verify APK signature and version" della CI stampa il valore reale.
build_number = 1
# Icona: assets/icon.png (vedi sopra — nessuna chiave pyproject per questo)

# Cartelle da NON impacchettare nell'app (2026-08-17). Chiave verificata nel
# sorgente installato di flet_cli 0.86.5 (`commands/build_base.py:1964-1974`:
# legge `tool.flet.<piattaforma>.app.exclude` e poi `tool.flet.app.exclude`) —
# non dedotta, dopo il precedente di `app.version`, una chiave di uno schema
# vecchio che per mesi non veniva letta da nessuno.
#
# Il valore predefinito esclude SOLO `build`, quindi finora finivano dentro ogni
# APK e ogni zip desktop: `.git/` (43 MB), `.venv/` (179 MB in locale; assente
# sui runner CI, che installano a livello globale), `docs/` (2,5 MB di markdown).
# Rilevante ora che l'app scarica i propri aggiornamenti da sé
# (`core/update_downloader.py`): è peso che ogni giocatore scarica ad ogni
# aggiornamento, spesso in tethering al tavolo.
#
# ⚠️ SOLO nomi di cartella, nessun glob tipo `test_*.py` o `*.md`. La lista
# viene passata al packager Dart (`serious_python:main package --exclude a,b,c`),
# che NON è installato in questo ambiente: se interpreti i glob o no non è
# verificabile da qui, e un pattern ignorato in silenzio darebbe l'illusione di
# un'esclusione che non avviene. I ~30 file di test pesano in tutto 760 KB —
# irrilevanti accanto ai 222 MB sopra, non vale correre il rischio di scoprire
# solo da una build reale che il glob non funziona.
#
# Da NON aggiungere qui: `assets/` e `data/game_data/` servono a RUNTIME (icona,
# JSON delle regole D&D). `extensions/` invece contiene i SORGENTI Dart delle
# estensioni native, che `flet build` compila per conto suo a partire da
# `[tool.flet.dev_packages]`: nel payload Python non servono.
app.exclude = [
    ".git",
    ".github",
    ".venv",
    "docs",
    "extensions",
    "storage",
]

# Permesso mancante trovato il 2026-08-05 indagando il bug "Unknown control:
# FilePicker" su Android segnalato da Davide: pyproject.toml non dichiarava
# ALCUN permesso di lettura immagini, necessario perché la selezione foto
# profilo (ProfiloTab._pick_photo_mobile()) funzioni una volta risolto il
# problema di fondo (probabile bug di packaging upstream di Flet — vedi
# dnd_app/docs/regole_flet_api.md, sezione FILE PICKER). Non è, da sola, la
# causa di "Unknown control" (un permesso mancante darebbe un errore DOPO
# l'apertura del picker, non un tipo di controllo sconosciuto PRIMA), ma va
# comunque corretta.
#
# Scelto il gruppo cross-platform "photo_library" (chiave `tool.flet.
# permissions`, distinta da `tool.flet.android.permission` sotto — letta da
# flet_cli 0.86.5, commands/build_base.py, BuildCommand.cross_platform_
# permissions) invece del permesso Android grezzo `READ_MEDIA_IMAGES`:
# mappa su `android.permission.READ_MEDIA_VISUAL_USER_SELECTED`, il permesso
# "selezione parziale" introdotto da Google proprio per l'uso che ne
# facciamo (scegliere UNA foto, non un accesso libero alla libreria) — il
# commento nel sorgente flet_cli cita esplicitamente la policy Play Store
# "Photo and Video Permissions" che rifiuta permessi media ampi senza un
# caso d'uso che li giustifichi. Copre gratis anche iOS
# (NSPhotoLibraryUsageDescription) per quando servirà.
#
# "camera" aggiunto il 2026-08-06 (sessione successiva) per lo scanner QR
# in-app (ui/views/world/qr_scanner_view.py) — espande, secondo la stessa
# documentazione ufficiale (https://flet.dev/docs/publish/#predefined-
# cross-platform-permission-bundles), in `android.permission.CAMERA` +
# `NSCameraUsageDescription` (iOS/macOS) + i flag `android.hardware.camera*`
# marcati "non obbligatori" (così l'app resta installabile anche su un
# dispositivo senza fotocamera, che semplicemente non vedrà mai il pulsante
# "Scansiona QR" — vedi `qr_scanner_supported()`). Nessun permesso
# microfono: lo scanner inizializza la fotocamera con `enable_audio=False`,
# non registra mai video.
permissions = ["photo_library", "camera"]

[tool.flet.android.permission]
# Multiplayer / LAN party (dnd_app/docs/multiplayer_design.md §3.4/§14.5):
# il master ospita un piccolo server HTTP sulla rete locale, i client vi si
# collegano (passo 4). L'app non è più "senza rete" per definizione, ma
# resta utilizzabile offline: il server si accende solo quando il master
# apre esplicitamente l'hosting (§9.4).
#
# NOTA: la vecchia chiave `[tool.flet.android] permissions = []` (plurale,
# lista) qui prima non aveva alcun effetto — verificato leggendo il sorgente
# installato di flet_cli 0.85.3 (build_base.py, BuildCommand.apply_icons_and_splash_images):
# quella versione legge SOLO `tool.flet.android.permission` (singolare, una
# tabella chiave/booleano), mai `tool.flet.android.permissions`. INTERNET è
# comunque già incluso di default dal build system a prescindere da questa
# tabella (`android_permissions = {"android.permission.INTERNET": True}`
# come base fissa); dichiarato qui comunque per chiarezza e perché il design
# doc lo richiede esplicitamente.
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
# Necessario dal passo 5 (scoperta automatica via broadcast UDP), innocuo
# dichiararlo già ora insieme agli altri due permessi di rete.
"android.permission.CHANGE_WIFI_MULTICAST_STATE" = true
# Aggiornamento in-app (2026-08-17): l'app scarica l'APK della nuova versione e
# lo passa all'installer di SISTEMA, che chiede conferma all'utente. Android non
# può mai installare in silenzio — è il modello di sicurezza del SO, non un
# limite di questo progetto: anche con questo permesso l'utente deve toccare
# "Installa" nella finestra di sistema, e la prima volta anche autorizzare
# "installa app sconosciute" per questa app.
#
# Il permesso da solo non basta: serve anche un FileProvider per esporre l'APK
# come URI `content://` (da Android 7 un `file://` solleva
# FileUriExposedException) e un intent nativo per lanciare l'installer — nulla di
# cui Flet offra un'API. Vedi `extensions/flet_apk_installer/`.
"android.permission.REQUEST_INSTALL_PACKAGES" = true

[tool.flet.ios]
team_id = ""  # Da compilare con l'Apple Team ID quando si pubblica su App Store
