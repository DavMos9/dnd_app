[project]
name = "flet-image-picker"
version = "0.1.0"
description = "Selettore immagini nativo (Android/iOS) per D&D Companion — estensione Flet su misura, wrapper del plugin Flutter ufficiale image_picker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet==0.86.5",
]

# Replica il pyproject.toml REALE del pacchetto ufficiale
# flet-audio-recorder (stesso schema, stessa chiave
# "flutter.<nome_pacchetto>"). VERIFICATO il 2026-08-06 con un vero
# `pip install --target ...` in sandbox: la wheel risultante imbarca
# davvero `flutter/flet_image_picker/` (pubspec.yaml + tutto `lib/`) fianco
# a fianco col pacchetto Python — vedi README.md in questa cartella per il
# dettaglio. Non verificato invece (richiede un vero toolchain Flutter/
# Dart, non disponibile qui): se `flet build` collega davvero questo
# pacchetto Flutter nel progetto generato, e se il codice Dart compila.
[tool.setuptools.package-data]
"flutter.flet_image_picker" = [
    "pubspec.yaml",
    "lib/**",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
