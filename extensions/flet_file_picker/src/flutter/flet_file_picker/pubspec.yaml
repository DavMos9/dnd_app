name: flet_file_picker
description: Flet FilePicker control — selettore file generico nativo (Android/iOS), wrapper del plugin ufficiale file_picker.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.2.3 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  # Pacchetto ufficiale più diffuso su pub.dev per selezione file arbitraria
  # (publisher miguelpruivo). CORRETTO 2026-08-17 dopo un fallimento REALE
  # di CI su tutte e 4 le piattaforme (build-windows/macos/linux/android,
  # run #54, `flet build` in "version solving failed"): `flet==0.86.5`
  # dichiara internamente `file_picker ^11.0.2` (per il suo `ft.FilePicker`
  # ufficiale — quello confermato non funzionante su Android reale, non
  # questa estensione), incompatibile col vincolo `^8.1.7` scritto qui alla
  # prima stesura (mai verificato su pub.dev, solo assunto). Allineato alla
  # stessa versione richiesta da Flet, non a un numero scelto a caso.
  file_picker: ^11.0.2

  # Stesso path relativo (e stesso avviso di NON verificato) di
  # flet_image_picker/pubspec.yaml — va corretto puntando alla vera
  # posizione del pacchetto Dart "flet" nell'albero generato da
  # `flet build`, non ricostruibile senza un toolchain Flutter/Flet reale.
  flet:
    path: ../../../../../../../packages/flet

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
